version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ticket_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ticket_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
    container_name: ticket_backend
    ports:
      - "4000:4000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=ticket_db
      - PORT=4000
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - db
    # In development, we can mount volume to see changes, but for docker-compose we'll just build it
    # volumes:
    #   - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: ticket_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - API_URL=http://backend:4000
    depends_on:
      - backend

volumes:
  postgres_data:
